<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title>Timeline</title>
  <desc>A concise timeline showing the profile owner&#x27;s academic and technical journey from 2023 to 2027.</desc>
  <defs>
    
  </defs>
  <style>
    :root {
        --bg: #fffafc;
        --surface: #fff1f6;
        --text: #1f1720;
        --muted: #6f5c67;
        --accent: #ff8fab;
        --accent-2: #d86f90;
        --line: #e7c7d3;
        --heading: Georgia, 'Times New Roman', serif;
        --body: Arial, Helvetica, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111014;
          --surface: #1a171d;
          --text: #f7eef2;
          --muted: #c8b4be;
          --accent: #ff8fab;
          --accent-2: #ffc2d1;
          --line: #3a2a33;
        }
      }
      .bg { fill: var(--bg); }
      .surface { fill: var(--surface); }
      .text { fill: var(--text); }
      .muted { fill: var(--muted); }
      .line { stroke: var(--line); }
      .accent { fill: var(--accent); }
      .accent-stroke { stroke: var(--accent); }
      .accent-2 { fill: var(--accent-2); }
      .heading { font-family: var(--heading); }
      .body { font-family: var(--body); }
  </style>
  
  <rect class="bg" width="1400" height="620" rx="36"/>
  <rect x="34" y="34" width="1332" height="552" rx="28" class="surface" stroke="var(--line)" stroke-width="1.5"/>
  <text x="74" y="88" class="muted body" font-size="16">TIMELINE</text>
  <path d="M96 106 V538" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="1068" y="76" width="226" height="90" rx="20" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <text x="1100" y="114" class="muted body" font-size="14">CURRENT ARC</text>
  <text x="1100" y="146" class="text heading" font-size="28">Research -> Product</text>
  
  <g transform="translate(0 106)">
    <circle cx="96" cy="0" r="14" class="surface" stroke="var(--line)" stroke-width="2"/>
    <text x="146" y="-12" class="text heading" font-size="24">2023</text>
    <text x="146" y="22" class="muted body" font-size="18">Started B.Tech in Computer Science (AI &amp; ML) at PES University</text>
  </g>

  <g transform="translate(0 214)">
    <circle cx="96" cy="0" r="14" class="surface" stroke="var(--line)" stroke-width="2"/>
    <text x="146" y="-12" class="text heading" font-size="24">2024</text>
    <text x="146" y="22" class="muted body" font-size="18">Participated in Hacknight and Space Race Hackathons</text>
  </g>

  <g transform="translate(0 322)">
    <circle cx="96" cy="0" r="14" class="surface" stroke="var(--line)" stroke-width="2"/>
    <text x="146" y="-12" class="text heading" font-size="24">2025</text>
    <text x="146" y="22" class="muted body" font-size="18">AI &amp; Cloud Technologies Intern at IBM SkillsBuild (Edunet Foundation)</text>
  </g>

  <g transform="translate(0 430)">
    <circle cx="96" cy="0" r="14" class="accent" stroke="var(--line)" stroke-width="2"/>
    <text x="146" y="-12" class="text heading" font-size="24">2026</text>
    <text x="146" y="22" class="muted body" font-size="18">AI Research Intern at CCBD &amp; CDSAML Research Center; started explainable financial misinformation research</text>
  </g>

  <g transform="translate(0 538)">
    <circle cx="96" cy="0" r="14" class="surface" stroke="var(--line)" stroke-width="2"/>
    <text x="146" y="-12" class="text heading" font-size="24">2027</text>
    <text x="146" y="22" class="muted body" font-size="18">Goal: Software Engineer / AI Engineer</text>
  </g>


</svg>
