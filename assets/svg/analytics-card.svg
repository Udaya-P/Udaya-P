<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title>GitHub Analytics</title>
  <desc>A compact analytics summary based on verified public GitHub metadata.</desc>
  <defs>
    
  </defs>
  <style>
    :root {
        --bg: #fffafc;
        --surface: #fff1f6;
        --text: #1f1720;
        --muted: #6f5c67;
        --accent: #ff8fab;
        --accent-2: #d86f90;
        --line: #e7c7d3;
        --heading: Georgia, 'Times New Roman', serif;
        --body: Arial, Helvetica, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111014;
          --surface: #1a171d;
          --text: #f7eef2;
          --muted: #c8b4be;
          --accent: #ff8fab;
          --accent-2: #ffc2d1;
          --line: #3a2a33;
        }
      }
      .bg { fill: var(--bg); }
      .surface { fill: var(--surface); }
      .text { fill: var(--text); }
      .muted { fill: var(--muted); }
      .line { stroke: var(--line); }
      .accent { fill: var(--accent); }
      .accent-stroke { stroke: var(--accent); }
      .accent-2 { fill: var(--accent-2); }
      .heading { font-family: var(--heading); }
      .body { font-family: var(--body); }
  </style>
  
  <rect class="bg" width="1200" height="420" rx="32"/>
  <rect x="28" y="28" width="1144" height="364" rx="24" class="surface" stroke="var(--line)" stroke-width="1.5"/>
  <text x="62" y="82" class="muted body" font-size="15">VERIFIED PUBLIC SNAPSHOT</text>
  <text x="62" y="132" class="text heading" font-size="34">21 public repositories</text>
  <text x="62" y="358" class="muted body" font-size="16">Account created on 2024-09-02 | Dominant public repo language: Python</text>
  <g transform="translate(700 72)">
    <rect width="394" height="118" rx="22" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <text x="30" y="38" class="muted body" font-size="14">PROFILE METADATA</text>
    <text x="30" y="76" class="text heading" font-size="26">0 followers · 0 following</text>
    <text x="30" y="100" class="muted body" font-size="15">Kept secondary to projects and research by design.</text>
  </g>
  
  <text x="62" y="160" class="muted body" font-size="16">Python</text>
  <rect x="236" y="144" width="320" height="16" rx="8" fill="var(--bg)"/>
  <rect x="236" y="144" width="320.0" height="16" rx="8" class="accent"/>
  <text x="574" y="160" class="text body" font-size="16">8</text>

  <text x="62" y="214" class="muted body" font-size="16">Jupyter Notebook</text>
  <rect x="236" y="198" width="320" height="16" rx="8" fill="var(--bg)"/>
  <rect x="236" y="198" width="280.0" height="16" rx="8" class="accent"/>
  <text x="574" y="214" class="text body" font-size="16">7</text>

  <text x="62" y="268" class="muted body" font-size="16">HTML</text>
  <rect x="236" y="252" width="320" height="16" rx="8" fill="var(--bg)"/>
  <rect x="236" y="252" width="120.0" height="16" rx="8" class="accent"/>
  <text x="574" y="268" class="text body" font-size="16">3</text>

  <text x="62" y="322" class="muted body" font-size="16">C++</text>
  <rect x="236" y="306" width="320" height="16" rx="8" fill="var(--bg)"/>
  <rect x="236" y="306" width="40.0" height="16" rx="8" class="accent"/>
  <text x="574" y="322" class="text body" font-size="16">1</text>


</svg>
